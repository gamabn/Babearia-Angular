<div class="container">

  <div class="containerH1">
   @if(visible){
    <h1>Cadastre de barbeiros</h1>
   }@else {
    <h1>Editar Barbeiros</h1>
   }
  </div>

   <div class="container-button">
    <div class="button-app" [class.active]="visible">
      <button
      (click)="visibleTrue()"
      >Barbeiros</button>
    </div>

    <div class="button-app" [class.active]="!visible">
      <button
      (click)="visibleFalse()"
      >Editar Barbeiros</button>
    </div>
   </div>

   @if(visible){

    <section> <!-- Formulário para Cadastrar ou Editar -->

    <form [formGroup]="form">
       <div>
        @if(preview){
        <img [src]="preview" alt="">
        }
       </div>
      <div class="form-input">
        <label for="">Imagem</label>
        <input
        [src]="preview"
        (change)="mudarImagem($event)"
        type="file">
      </div>

      <div class="form-input">
        <label for="">Nome</label>
        <input
        formControlName="name"
         type="text">
      </div>

      <div class="form-input">
        <label for="">Telefone</label>
        <input
        formControlName="phone"
         type="text">
      </div>

      <button type="submit" (click)="onSubmit()">{{ editingBarber ? 'Salvar Alterações' : 'Cadastrar' }}</button>

    </form>
  </section>
   }@else {
     <section> <!-- Lista de barbeiros para edição -->
      <h2>Selecione um barbeiro para editar</h2>
      @for(barbeiro of barbeiros; track barbeiro.id) {
        <div class="barbeiro-item">
          <img [src]="barbeiro.img_url" alt="Foto de {{ barbeiro.name }}">
          <span>{{ barbeiro.name }} - {{ barbeiro.barber_phone }}</span>
          <button (click)="selectBarberToEdit(barbeiro)">Editar</button>
        </div>
      } @empty {
        <p>Nenhum barbeiro cadastrado.</p>
      }
     </section>
   }


</div>
