<div class="container">
  <div
    style="height: 200px; width: 500px; display: flex; flex-direction: column; align-items: center"
  >
    <div>
      <h1>Cliente</h1>
    </div>

    <form class="form" (ngSubmit)="submit()" [formGroup]="form">
      <div class="form-input">
        <label for="">Nome</label>
        <input placeholder="Digite seu nome" formControlName="nome" type="text" />
      </div>

      <div class="form-input">
        <label for="">Telefone</label>
        <input placeholder="Telefone" formControlName="telefone" type="text" />
      </div>
      <div class="form-button">
        <button type="submit" [disabled]="form.invalid">Cadastrar</button>
      </div>
    </form>
  </div>
</div>
